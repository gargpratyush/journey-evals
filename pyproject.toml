[project]
name = "journey-evals"
version = "0.1.0"
description = "Evidence-backed evaluations for browser journeys and AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Pratyush Garg" }]
keywords = ["testing", "e2e", "browser", "evaluation", "agents", "llm-as-a-judge", "qa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1"]

[project.optional-dependencies]
# The LangChain demo agent under examples/. Agent evaluations never require these: the adapter
# talks to a compiled graph's stream() surface, so an agent brings its own framework version.
langchain-demo = ["langchain>=1,<2", "langgraph>=1,<2", "langchain-openai>=1,<2"]

[project.scripts]
jev = "jev_ultrafast.demo:main"
journey-evals = "journey_evals.cli:main"

[project.urls]
Homepage = "https://github.com/gargpratyush/journey-evals"
Documentation = "https://github.com/gargpratyush/journey-evals/blob/main/docs/guide.md"
Source = "https://github.com/gargpratyush/journey-evals"
Issues = "https://github.com/gargpratyush/journey-evals/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Two packages, deliberately. journey_evals is this product; jev_ultrafast is the browser agent it
# was built around, imported from browser-use/jev-ultrafast and kept under its own name.
[tool.hatch.build.targets.wheel]
packages = ["journey_evals", "jev_ultrafast"]

# The example application and its journeys ship inside the distribution. Installed from npm or
# PyPI, a user has no `examples/` source tree, and `journey-evals demo` has to have something real
# to drive. In a checkout the source tree is still the one that runs; see journey_evals/paths.py.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "journey_evals/_examples"

# A source distribution should be enough to build, test and read the project. It is not an archive
# of how the project was developed: `artifacts/` holds this campaign's own run receipts, `plans/`
# holds its planning, and the documentation media is large and already on the repository page.
[tool.hatch.build.targets.sdist]
exclude = [
  "artifacts",
  "artifacts/**",
  "/artifacts/feasibility",
  "plans",
  "npm",
  "docs/demo.gif",
  "docs/demo.mp4",
  "docs/inspector.png",
  "docs/flights-result.png",
  "docs/media",
  "docs/banner.svg",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

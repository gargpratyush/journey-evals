<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sandbox workspace plans</title>
<style>
body { font:18px system-ui; margin:32px; max-width:880px; }
fieldset { border:1px solid #777; padding:16px; margin:0 0 20px; }
legend { padding:0 8px; font-weight:600; }
label { display:block; margin:12px 0; }
input[type=text],input[type=email] { font:inherit; padding:8px; width:22em; }
button { font:inherit; padding:10px; }
[role=status] { min-height:26px; }
[hidden] { display:none; }
</style>
<h1>Sandbox workspace</h1>
<p>Local synthetic subscriptions only. No payment or real service.</p>
<div role="status" id="status" aria-live="polite"></div>

<form id="signup">
  <fieldset id="plan-section">
    <legend>1. Choose a plan</legend>
    <label><input type="radio" name="plan" value="P-STARTER"> Starter USD 0.00 per month</label>
    <label><input type="radio" name="plan" value="P-TEAM"> Team USD 40.00 per month</label>
    <label><input type="radio" name="plan" value="P-BUSINESS"> Business USD 90.00 per month</label>
  </fieldset>

  <fieldset id="details-section" hidden>
    <legend>2. Workspace details</legend>
    <label>Workspace name <input type="text" id="workspace" autocomplete="off"></label>
    <label>Admin email <input type="email" id="email" autocomplete="off"></label>
    <button type="button" id="availability" disabled>Check workspace availability</button>
  </fieldset>

  <fieldset id="review-section" hidden>
    <legend>3. Review subscription</legend>
    <p id="review-summary"></p>
    <p id="selected-line"></p>
    <p id="total-line"></p>
    <p id="disclosure"></p>
    <button type="button" id="subscribe">Start sandbox subscription</button>
  </fieldset>

  <fieldset id="confirmation-section" hidden>
    <legend>4. Confirmation</legend>
    <p id="confirmation-body"></p>
  </fieldset>
</form>

<script>
const store = {
  step: 'plan', plan_id: null, plan: null, selected_cents: null,
  workspace: '', email: '', quote: null, subscription: null,
};
const PLANS = {
  'P-STARTER': {name: 'Starter', cents: 0},
  'P-TEAM': {name: 'Team', cents: 4000},
  'P-BUSINESS': {name: 'Business', cents: 9000},
};
const money = cents => (cents / 100).toFixed(2);
const el = id => document.getElementById(id);
const status = el('status');

const request = async (path, body) => {
  const response = await fetch(path, body
    ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}
    : {});
  if (!response.ok) throw new Error(`Request failed: ${response.status}`);
  return response.json();
};

// One dispatcher owns every visible transition. Sections persist in the document and are
// revealed, rather than one container being rewritten at each step.
function render() {
  const steps = ['plan', 'details', 'review', 'confirmation'];
  const reached = steps.indexOf(store.step);
  el('details-section').hidden = reached < 1;
  el('review-section').hidden = reached < 2;
  el('confirmation-section').hidden = reached < 3;
  el('availability').disabled = !(store.workspace.trim() && store.email.trim());
  if (reached >= 2 && store.quote) {
    el('review-summary').textContent =
      `${store.plan} plan for ${store.workspace}, administered by ${store.email}. Plan ${store.plan_id}.`;
    el('selected-line').textContent = `Selected plan: USD ${money(store.selected_cents)} per month`;
    el('total-line').textContent = `Checkout total: USD ${money(store.quote.cents)} per month`;
    el('disclosure').textContent = store.quote.disclosure;
    el('subscribe').textContent = store.quote.disclosure
      ? 'Accept price change and start subscription'
      : 'Start sandbox subscription';
  }
  if (reached >= 3 && store.subscription) {
    el('confirmation-body').textContent =
      `Subscription ${store.subscription.id} active. ${store.subscription.plan} plan for `
      + `${store.subscription.workspace}. Charged: USD ${money(store.subscription.cents)} per month.`;
  }
  document.title = {
    plan: 'Sandbox workspace plans', details: 'Sandbox workspace details',
    review: 'Sandbox subscription review', confirmation: 'Sandbox subscription confirmation',
  }[store.step];
}

for (const radio of document.querySelectorAll('input[name=plan]')) {
  radio.addEventListener('change', () => {
    store.plan_id = radio.value;
    store.plan = PLANS[radio.value].name;
    store.selected_cents = PLANS[radio.value].cents;
    store.step = 'details';
    render();
  });
}
for (const [id, field] of [['workspace', 'workspace'], ['email', 'email']]) {
  el(id).addEventListener('input', () => { store[field] = el(id).value; render(); });
}

el('availability').onclick = async () => {
  el('availability').disabled = true;
  status.textContent = 'Checking workspace availability';
  try {
    await request('/availability', {workspace: store.workspace});
    status.textContent = '';
    store.quote = await request('/price');
    store.step = 'review';
    render();
  } catch (error) {
    status.textContent = 'Availability check failed';
    console.error(error);
  }
};

el('subscribe').onclick = async () => {
  el('subscribe').disabled = true;
  const payload = {
    plan_id: store.plan_id, plan: store.plan, workspace: store.workspace,
    email: store.email, selected_cents: store.selected_cents,
  };
  if (store.quote.disclosure) payload.acknowledged_cents = store.quote.cents;
  store.subscription = await request('/subscribe', payload);
  store.step = 'confirmation';
  render();
};

render();
</script>
</html>
